apiVersion: apps/v1
kind: Deployment
metadata:
  name: forex-mtl
  namespace: forex
spec:
  replicas: 3
  selector:
    matchLabels:
      app: forex-mtl
  template:
    metadata:
      labels:
        app: forex-mtl
    spec:
      containers:
        - name: forex-mtl
          image: forex-mtl:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: forex-mtl-config
            - secretRef:
                name: one-frame-token
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: forex-mtl
  namespace: forex
spec:
  selector:
    app: forex-mtl
  ports:
    - name: http
      port: 8081
      targetPort: 8081
