services:
  redis:
    image: redis:7-alpine
    container_name: forex-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  one-frame:
    image: paidyinc/one-frame
    container_name: forex-one-frame
    ports:
      - "8080:8080"

  forex-mtl:
    image: forex-mtl:local
    container_name: forex-mtl
    build:
      context: .
      dockerfile: forex-mtl/Dockerfile
    depends_on:
      - redis
      - one-frame
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8081"
      ONE_FRAME_BASE_URI: "http://one-frame:8080"
      ONE_FRAME_TOKEN: "10dc303535874aeccc86a8251e6992f5"
      ONE_FRAME_REFRESH_INTERVAL: "4 minutes"
      ONE_FRAME_MAX_RATE_AGE: "5 minutes"
      REDIS_URI: "redis://redis:6379"
      REDIS_KEY_PREFIX: "forex:rates"
    ports:
      - "8081:8081"

volumes:
  redis-data:
